name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  editmode-tests:
    name: EditMode (${{ matrix.unity }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unity: 2022.3.22f1
            project: DevProject~/2022.3
          - unity: 6000.6.0f1
            project: DevProject~/6000.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/Library
          key: Library-${{ matrix.unity }}-${{ hashFiles('**/*.asmdef', 'package.json') }}
          restore-keys: |
            Library-${{ matrix.unity }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ matrix.project }}
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: test-results-${{ matrix.unity }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results (${{ matrix.unity }})

      - name: Check Shiori.Core does not reference UnityEngine / UnityEditor
        run: |
          dll="${{ matrix.project }}/Library/ScriptAssemblies/Shiori.Core.dll"
          test -f "$dll" || { echo "missing $dll"; exit 1; }
          if grep -a -q -E 'UnityEngine|UnityEditor' "$dll"; then
            echo "Shiori.Core.dll references Unity assemblies"; exit 1
          fi
          echo "OK: Shiori.Core.dll has no Unity references"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.unity }}
          path: test-results-${{ matrix.unity }}
