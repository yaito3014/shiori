name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode-tests:
    name: EditMode (${{ matrix.unity }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unity: [2022.3.22f1, 6000.6.0f1]
    env:
      PROJECT: ci-project/${{ matrix.unity }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the dev project
        shell: pwsh
        run: ./Tools~/New-DevProject.ps1 -UnityVersion ${{ matrix.unity }} -Destination $env:PROJECT

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: Library-${{ matrix.unity }}-${{ hashFiles('**/*.asmdef', 'package.json') }}
          restore-keys: |
            Library-${{ matrix.unity }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT }}
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: test-results-${{ matrix.unity }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results (${{ matrix.unity }})

      - name: Check Shiori.Core does not reference UnityEngine / UnityEditor
        run: |
          dll="$PROJECT/Library/ScriptAssemblies/Shiori.Core.dll"
          test -f "$dll" || { echo "missing $dll"; exit 1; }
          if grep -a -q -E 'UnityEngine|UnityEditor' "$dll"; then
            echo "Shiori.Core.dll references Unity assemblies"; exit 1
          fi
          echo "OK: Shiori.Core.dll has no Unity references"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.unity }}
          path: test-results-${{ matrix.unity }}
